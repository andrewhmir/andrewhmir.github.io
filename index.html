<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andrew Alangcao</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">

  <!-- Google Fonts: Inter + Roboto -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="files/Nailong.png">
</head>

<body>

  <!-- Scroll Progress -->
  <div class="scroll-progress" id="scrollProgress"></div>

  <!-- Navigation -->
  <header class="nav-header" id="navHeader">
    <div class="nav-inner">
      <a href="#Home" class="nav-brand">Andrew Alangcao</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="nav-menu" id="navMenu">
        <ul class="nav-list" id="navList">
          <!-- Rendered by JS -->
        </ul>
      </nav>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="section hero" id="Home">
    <div class="container hero-grid">
      <div class="hero-image-col">
        <img class="hero-photo" src="files/profile.jpg" alt="Andrew Alangcao">
      </div>
      <div class="hero-text-col">
        <div class="hero-header">
          <h1 class="hero-name">Andrew Alangcao</h1>
          <p class="hero-role">Data Engineer | Computational Cognition Researcher</p>
        </div>
        <div class="hero-bio-container" id="heroBio">
          <!-- Rendered by JS -->
        </div>
        <div class="hero-links" id="heroLinks">
          <!-- Rendered by JS -->
        </div>
      </div>
    </div>
  </section>

  <!-- News Section -->
  <section class="section" id="News">
    <div class="container">
      <h2 class="section-heading" data-before="What's New">News</h2>
      <div class="timeline" id="newsTimeline">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Projects Section -->
  <section class="section" id="Projects">
    <div class="container">
      <h2 class="section-heading" data-before="Featured Work">Selected Projects</h2>
      <p class="section-note">(* indicates equal contribution)</p>
      <div class="project-list" id="projectList">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Popup Modal (single shared instance) -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal-card" id="modalCard">
      <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
      <div class="modal-header" id="modalHeader"></div>
      <div class="modal-scroll">
        <div class="modal-image-wrap" id="modalImage"></div>
        <div class="modal-body" id="modalBody"></div>
      </div>
    </div>
  </div>

  <!-- Leadership Section -->
  <section class="section" id="Leadership">
    <div class="container">
      <h2 class="section-heading" data-before="Service">Leadership Experience</h2>
      <div class="record-list" id="leadershipList">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Honors Section -->
  <section class="section" id="Honors">
    <div class="container">
      <h2 class="section-heading" data-before="Recognition">Selected Honors</h2>
      <div class="record-list" id="honorsList">
        <!-- Rendered by JS -->
      </div>
    </div>
  </section>

  <!-- Footer -->
  <footer class="site-footer">
    <div class="container">
      <p>&copy; <span id="currentYear"></span> Andrew Alangcao. All rights reserved.</p>
    </div>
  </footer>

  <!-- Back to Top -->
  <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
    <img src="files/Nailong.png" alt="" width="22" height="22">
  </button>

  <!-- Data -->
  <script src="js/data.js"></script>

  <!-- Core Script -->
  <script src="js/main.js"></script>
</body>

</html>
