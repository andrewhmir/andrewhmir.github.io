<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andrew Alangcao</title>

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css" integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm" crossorigin="anonymous">

  <!-- Google Fonts: Inter + JetBrains Mono -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="files/Nailong.png">
</head>

<body>

  <!-- ════════════════════════════════════════════════════════════
       Atmospheric Background (fixed, behind all content)
       Drop your painting as files/painting.jpg
       ════════════════════════════════════════════════════════════ -->
  <div class="bg-atmosphere">
    <div class="bg-dots"></div>
    <div class="bg-painting"></div>
    <div class="bg-orb bg-orb--blue"></div>
    <div class="bg-orb bg-orb--teal"></div>
    <div class="bg-orb bg-orb--indigo"></div>
  </div>

  <!-- ════════════════════════════════════════════════════════════
       Content Layer
       ════════════════════════════════════════════════════════════ -->
  <div class="content-layer">

    <!-- Scroll Progress -->
    <div class="scroll-progress" id="scrollProgress"></div>

    <!-- Navigation (floating pill) -->
    <header class="nav-header" id="navHeader">
      <a href="#Home" class="nav-brand">Andrew Alangcao</a>
      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span class="nav-toggle-bar"></span>
        <span class="nav-toggle-bar"></span>
      </button>
      <nav class="nav-menu" id="navMenu">
        <ul class="nav-list" id="navList">
          <!-- Rendered by JS -->
        </ul>
      </nav>
    </header>

    <!-- Hero Section -->
    <section class="section hero" id="Home">
      <div class="container">
        <div class="hero-photo-wrap">
          <div class="hero-photo-glow"></div>
          <img class="hero-photo" id="heroPhoto" loading="lazy" alt="Andrew Alangcao">
        </div>
        <h1 class="hero-name">Andrew Alangcao</h1>
        <p class="hero-role">Data Engineer &nbsp;·&nbsp; Computational Cognition Researcher</p>
        <div class="hero-bio-container" id="heroBio">
          <!-- Rendered by JS -->
        </div>
        <div class="hero-links" id="heroLinks">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

    <!-- No-JS Fallback -->
    <noscript>
      <section class="section">
        <div class="container" style="text-align:center;padding:40px 0;">
          <h2 style="color:var(--text-bright);margin-bottom:16px;">Andrew Alangcao</h2>
          <p style="color:var(--text-body);max-width:560px;margin:0 auto 16px;">Data Engineer | Computational Cognition Researcher</p>
          <p style="color:var(--text-body);max-width:560px;margin:0 auto 16px;">My work and studies revolve around understanding perception as a foundation for building more general, adaptive AI systems, with the long-term goal of contributing to AGI development — all to improve everyday life for people in the Philippines and around the world.</p>
          <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
            <a href="https://drive.google.com/file/d/1lb3D1vB__Xfi5UD1Z22mGeGJtVetw_1M/view?usp=sharing" style="color:var(--accent);">Resume</a>
            <a href="https://github.com/andrewhmir" style="color:var(--accent);">GitHub</a>
            <a href="https://www.linkedin.com/in/andrew-alangcao/" style="color:var(--accent);">LinkedIn</a>
            <a href="mailto:andrew.alangcao@gmail.com" style="color:var(--accent);">Email</a>
          </div>
        </div>
      </section>
    </noscript>

    <!-- News Section -->
    <section class="section" id="News">
      <div class="container">
        <p class="section-label">What's New</p>
        <h2 class="section-heading">News</h2>
        <div class="timeline" id="newsTimeline">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

    <!-- Projects Section -->
    <section class="section" id="Projects">
      <div class="container">
        <p class="section-label">Featured Work</p>
        <h2 class="section-heading">Selected Projects</h2>
        <p class="section-note">(* indicates equal contribution)</p>
        <div class="project-list" id="projectList">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

    <!-- Popup Modal (single shared instance) -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" id="modalCard">
        <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
        <div class="modal-header" id="modalHeader"></div>
        <div class="modal-scroll">
          <div class="modal-image-wrap" id="modalImage"></div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>
    </div>

    <!-- Leadership Section -->
    <section class="section" id="Leadership">
      <div class="container">
        <p class="section-label">Service</p>
        <h2 class="section-heading">Leadership Experience</h2>
        <div class="record-list" id="leadershipList">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

    <!-- Honors Section -->
    <section class="section" id="Honors">
      <div class="container">
        <p class="section-label">Recognition</p>
        <h2 class="section-heading">Selected Honors</h2>
        <div class="record-list" id="honorsList">
          <!-- Rendered by JS -->
        </div>
      </div>
    </section>

    <!-- Footer -->
    <footer class="site-footer">
      <div class="container">
        <p>&copy; <span id="currentYear"></span> Andrew Alangcao. All rights reserved.</p>
      </div>
    </footer>

    <!-- Back to Top -->
    <button class="scroll-top" id="scrollTopBtn" aria-label="Scroll to top">
      <img src="files/Nailong.png" alt="" width="20" height="20">
    </button>

  </div><!-- /content-layer -->

  <!-- Data -->
  <script src="js/data.js"></script>

  <!-- Core Script -->
  <script src="js/main.js"></script>
</body>

</html>
