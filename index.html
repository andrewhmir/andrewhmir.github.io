<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andrew Alangcao</title>

  <meta name="description" content="Andrew Alangcao — Data Engineer and Computational Cognition Researcher. Robotics, biometrics, and applied AI projects, with awards from national and international competitions.">
  <meta name="theme-color" content="#080c0e">
  <link rel="canonical" href="https://andrewhmir.github.io/">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Andrew Alangcao">
  <meta property="og:url" content="https://andrewhmir.github.io/">
  <meta property="og:title" content="Andrew Alangcao — Data Engineer &amp; Computational Cognition Researcher">
  <meta property="og:description" content="Robotics, biometrics, and applied AI projects, with awards from national and international competitions.">
  <meta property="og:image" content="https://andrewhmir.github.io/files/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <!-- `og:image:alt` is not decoration: without it a screen reader announces the
       share card as an unlabelled image, which is what a card with no text in it
       sounds like. It describes what the card actually shows. -->
  <meta property="og:image:alt" content="Andrew Alangcao — Data Engineer and Computational Cognition Researcher, with the collection's framed photographs.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- `twitter:image` is listed as optional and is not: the card is declared
       `summary_large_image`, and without an explicit image X falls back to a
       compact card with no picture at all. -->
  <meta name="twitter:image" content="https://andrewhmir.github.io/files/og-card.jpg">
  <meta name="twitter:image:alt" content="Andrew Alangcao — Data Engineer and Computational Cognition Researcher, with the collection's framed photographs.">

  <!-- Fonts: Newsreader + Courier Prime, VENDORED.
       These were two hosts and two `preconnect`s — `fonts.googleapis.com` for the
       stylesheet and `fonts.gstatic.com` for the bytes. Both live in
       `files/fonts/` now, declared by the generated `css/fonts.css`, so the page
       fetches no font from anyone. `unicode-range` is preserved, so a visit still
       downloads only the subsets it uses. See `files/fonts/README.md`. -->
  <link rel="stylesheet" href="css/fonts.css">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon. One 512px PNG serves both roles: the browser tab scales it down,
       and iOS accepts a 512 for `apple-touch-icon` (it asks for 180 but honours
       a larger source), so there is no second asset to keep in sync. -->
  <link rel="icon" type="image/png" sizes="512x512" href="files/Nailong.png">
  <link rel="apple-touch-icon" href="files/Nailong.png">
</head>

<body>

  <!-- ════════════════════════════════════════════════════════════
       Content Layer
       ════════════════════════════════════════════════════════════ -->
  <div class="content-layer">

    <!-- The document's one `h1`, and the only heading of the first rank. The
         walk has no masthead — it opens straight onto the first stand, and a
         title band would be chrome this design does not have — so the `h1` is
         `.sr-only`: it is read, never painted.

         It is NOT a copy of any room heading, and that distinction is the whole
         reason it is allowed where `#roomRail` was not. A room heading names a
         ROOM (Robotics, Honours); this names the COLLECTION and its author, and
         no room heading does that. The fault that deleted the rail was a
         second, smaller copy of a heading already on screen — not the existence
         of a heading. Without this element the outline begins at
         `h2.room-title`, leaving the document with no heading of the first rank
         at all. `shell-check.mjs` asserts it exists and that it stays hidden. -->
    <h1 class="sr-only">Andrew Alangcao — Data Engineer and Computational Cognition Researcher</h1>

    <!-- The walk names the area it is standing in with the room's OWN heading:
         `h2.room-title` carries `position: sticky` and travels with the walk.
         There is deliberately no second header here. The `<header
         class="room-rail" id="roomRail">` that used to sit at this spot held a
         15-19px COPY of the current room's title, refilled by writeRail() on
         every boundary crossed, while the real 27-48px heading scrolled away.
         Do not reintroduce it — a copy is the fault, not the fix. -->

    <!-- The only navigation: the walk's directory at its foot, with the walk's
         progress filling inside the dock box rather than along the screen edge.

         #directory and #dockProgress are SIBLINGS inside the dock, and that is
         load-bearing: renderDock() writes #directory.innerHTML, which destroys
         every child node it has, so a progress bar placed inside #directory
         would be wiped on every render. #directory is a plain div and not a
         span — it holds an <ol> of buttons, which a span may not contain. -->
    <nav class="dock" aria-label="Rooms">
      <div class="dock-links" id="directory"></div>
      <div class="dock-track" id="dockProgress" aria-hidden="true"></div>
    </nav>

    <!-- The walk. Nine rooms sit side by side in one strip; Lenis smooths the
         journey, and nothing latches it onto a stand — the snap this comment
         used to promise was removed, plugin and all. Rooms are rendered by JS
         from PORTFOLIO + Site.deriveRooms + Site.honoursSplit.

         The mural is this hall's own background, with
         `background-attachment: local` so the browser carries it with the
         scroll. It is NOT a layer element: an `inset: 0` layer resolves against
         the hall's padding box, which is one viewport wide (987px) inside a
         32227px scroll, so the mural stopped after the first screen. See the
         note on #hall in the stylesheet.

         tabindex="0" makes the scroll container itself reachable by keyboard:
         it is the document's only scroller, so without it the arrow keys cannot
         move the walk and nothing inside it can be tabbed to. -->
    <main id="hall" class="hall" tabindex="0" aria-label="The collection">
      <div id="strip" class="strip">
        <!-- Rooms rendered by JS from PORTFOLIO + Site.deriveRooms -->
      </div>
    </main>

    <!-- No-JS Fallback -->
    <noscript>
      <section class="section">
        <div class="container" style="text-align:center;padding:40px 0;">
          <h2 style="font-family:Georgia,serif;color:var(--text-bright);margin-bottom:16px;">Andrew Alangcao</h2>
          <p style="color:var(--text-body);max-width:560px;margin:0 auto 16px;">Data Engineer | Computational Cognition Researcher</p>
          <p style="color:var(--text-body);max-width:560px;margin:0 auto 16px;">My work and studies revolve around understanding perception as a foundation for building more general, adaptive AI systems, with the long-term goal of contributing to AGI development — all to improve everyday life for people in the Philippines and around the world.</p>
          <div style="display:flex;justify-content:center;gap:12px;flex-wrap:wrap;">
            <a href="https://drive.google.com/file/d/1lb3D1vB__Xfi5UD1Z22mGeGJtVetw_1M/view?usp=sharing" style="color:var(--accent);">Resume</a>
            <a href="https://github.com/andrewhmir" style="color:var(--accent);">GitHub</a>
            <a href="https://www.linkedin.com/in/andrew-alangcao/" style="color:var(--accent);">LinkedIn</a>
            <a href="mailto:andrew.alangcao@gmail.com" style="color:var(--accent);">Email</a>
          </div>
        </div>
      </section>
    </noscript>

    <!-- Popup Modal (single shared instance). A child of .content-layer so the
         existing inert logic keeps working. -->
    <div class="modal-overlay" id="modalOverlay">
      <div class="modal-card" id="modalCard" role="dialog" aria-modal="true"
           aria-labelledby="modalTitle" tabindex="-1">
        <button class="modal-close" id="modalClose" aria-label="Close modal">&times;</button>
        <div class="modal-header" id="modalHeader"></div>
        <div class="modal-scroll">
          <div class="modal-image-wrap" id="modalImage"></div>
          <div class="modal-body" id="modalBody"></div>
        </div>
      </div>
    </div>

    <!-- Announces the current room on change -->
    <div id="announcer" class="sr-only" role="status" aria-live="polite"></div>
  </div><!-- /content-layer -->

  <!-- Data -->
  <script src="js/data.js"></script>

  <!-- The twelve glyphs the walk draws, inlined as SVG. GENERATED by
       tools/vendor-icons.mjs, and `Site.icon()` is its only reader.

       Load order is load-bearing: it goes AFTER `js/data.js`, which creates the
       `Site` object this file assigns onto, and BEFORE `js/main.js`, which calls
       `Site.icon()`. tests/shell-check.mjs asserts both halves.

       It is where the page's last third-party request went. `index.html` used to
       link Font Awesome's stylesheet at `use.fontawesome.com` for these twelve
       shapes, and the `<i class="fas …">` call sites in `js/main.js` and
       `js/data.js` are `Site.icon()` calls now, so nothing on this page is
       fetched from another host. tests/shell-check.mjs asserts that too, and it
       reads this file with its comments stripped, so that naming the host in
       this note cannot be mistaken for reintroducing it. -->
  <script src="js/icons.js"></script>

  <!-- Vendored: Lenis 1.3.26 (MIT). Provenance and pinned hashes: js/vendor/README.md
       Lenis is the only vendored script: `lenis-snap` used to sit here, and the
       walk's snap went with it. -->
  <script src="js/vendor/lenis.min.js"></script>

  <!-- Core Script -->
  <script src="js/main.js"></script>
</body>

</html>
