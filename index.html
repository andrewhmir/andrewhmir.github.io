<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Andrew Alangcao</title>

  <meta name="description" content="Andrew Alangcao — Data Engineer and Computational Cognition Researcher. Robotics, biometrics, and applied AI projects, with awards from national and international competitions.">
  <meta name="theme-color" content="#080c0e">
  <link rel="canonical" href="https://andrewhmir.github.io/">

  <!-- Open Graph / social preview -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Andrew Alangcao">
  <meta property="og:url" content="https://andrewhmir.github.io/">
  <meta property="og:title" content="Andrew Alangcao — Data Engineer &amp; Computational Cognition Researcher">
  <meta property="og:description" content="Robotics, biometrics, and applied AI projects, with awards from national and international competitions.">
  <meta property="og:image" content="https://andrewhmir.github.io/files/og-card.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <!-- `og:image:alt` is not decoration: without it a screen reader announces the
       share card as an unlabelled image. It describes what the card shows. -->
  <meta property="og:image:alt" content="Andrew Alangcao — Data Engineer and Computational Cognition Researcher, over Fernando Amorsolo's Planting Rice.">
  <meta name="twitter:card" content="summary_large_image">
  <!-- `twitter:image` is not optional: the card is declared
       `summary_large_image`, and without it X falls back to a card with no picture. -->
  <meta name="twitter:image" content="https://andrewhmir.github.io/files/og-card.jpg">
  <meta name="twitter:image:alt" content="Andrew Alangcao — Data Engineer and Computational Cognition Researcher, over Fernando Amorsolo's Planting Rice.">

  <!-- Fonts: Newsreader + Courier Prime, VENDORED. Declared by the generated
       css/fonts.css; the page fetches no font from a third party. `unicode-range`
       is preserved, so a visit downloads only the subsets it uses.
       See files/fonts/README.md. -->
  <link rel="stylesheet" href="css/fonts.css">

  <!-- Styles: the Long Field profile page. -->
  <link rel="stylesheet" href="css/styles.css">

  <!-- Favicon. One 512px PNG serves both roles: the browser tab scales it down,
       and iOS accepts a 512 for `apple-touch-icon`, so there is no second asset
       to keep in sync. -->
  <link rel="icon" type="image/png" sizes="512x512" href="files/Nailong.png">
  <link rel="apple-touch-icon" href="files/Nailong.png">
</head>

<body>
  <a class="skip" href="#page">Skip to content</a>

  <!-- Masthead: transparent over the hero, gains a blur + border once the walk
       begins. The hairline at its foot is the page's scroll progress. -->
  <header class="masthead" id="masthead">
    <a class="brand" href="#top">Andrew Alangcao</a>
    <nav class="menu" aria-label="Sections">
      <a href="#about">About</a>
      <a href="#work">Work</a>
      <a href="#honours">Honours</a>
      <a href="#contact">Contact</a>
    </nav>
    <a class="resume" id="resumeLink" href="#">Resume ↗</a>
    <div class="progress" id="progress" aria-hidden="true"></div>
  </header>

  <!-- The left-edge shade: keeps the journey rail legible over bright crops.
       It is the only fixed element besides the rail, and it is decoration. -->
  <div class="rail-shade" aria-hidden="true"></div>

  <!-- The journey line: one stop per section, filled in by js/main.js -->
  <nav class="rail" id="rail" aria-label="The walk through the profile"></nav>

  <!-- Sections are rendered from PORTFOLIO by js/main.js. The shell stays empty
       on purpose: all content lives in js/data.js, and no copy is duplicated
       here except the no-JS fallback below. -->
  <main id="page" class="page"></main>

  <footer class="foot">
    <span class="foot__name">Andrew Alangcao</span>
    <span class="foot__credit">Paintings by Fernando Amorsolo y Cueto (1892–1972)</span>
    <span class="foot__year">© 2026</span>
  </footer>

  <!-- No-JS fallback: the page is rendered by JS, so state the essentials
       plainly rather than leaving a blank document. -->
  <noscript>
    <section class="noscript">
      <h1>Andrew Alangcao</h1>
      <p>Data Engineer and Computational Cognition Researcher. Robotics, biometrics, and applied AI projects, with awards from national and international competitions.</p>
      <p>I want to turn my inspiration into work that makes the world a little better. This site is a record of my pursuit of that.</p>
      <p><a href="mailto:andrew.alangcao@gmail.com">andrew.alangcao@gmail.com</a> · <a href="https://github.com/andrewhmir">GitHub</a> · <a href="https://www.linkedin.com/in/andrew-alangcao/">LinkedIn</a></p>
    </section>
  </noscript>

  <!-- The one shared record dialog. Project records embed a muted video player;
       leadership and honours records open their photographs. -->
  <div class="dialog" id="dialog" hidden>
    <div class="dialog__card" role="dialog" aria-modal="true" aria-labelledby="dialogTitle" tabindex="-1">
      <button class="dialog__close" id="dialogClose" type="button" aria-label="Close record">×</button>
      <p class="dialog__meta" id="dialogMeta"></p>
      <h3 class="dialog__title" id="dialogTitle"></h3>
      <div class="dialog__body" id="dialogBody"></div>
    </div>
  </div>

  <!-- Data: PORTFOLIO is the single source of truth for all authored content. -->
  <script src="js/data.js"></script>
  <!-- Renderer: builds the sections, the rail and the dialog. -->
  <script src="js/main.js"></script>
</body>

</html>
